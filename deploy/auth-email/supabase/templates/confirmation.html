<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>确认你的注册邮箱</title></head>
  <body style="margin:0;padding:24px 12px;background:#f4f2ed;color:#203858;font-family:'Microsoft YaHei',Arial,sans-serif;">
    <table role="presentation" style="width:100%;max-width:560px;margin:0 auto;border-collapse:collapse;background:#fffdf8;border-top:4px solid #203858;">
      <tr><td style="padding:32px 28px 12px;font-size:22px;font-weight:bold;">空天大学</td></tr>
      <tr><td style="padding:8px 28px 28px;font-size:16px;line-height:1.8;">
        <h1 style="font-size:24px;line-height:1.4;margin:0 0 20px;">确认你的注册邮箱</h1>
        <p>你好：</p>
        <p>你正在注册空天大学网站账号。请点击下方按钮，确认使用此邮箱完成注册。</p>
        <p style="margin:28px 0;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;background:#203858;color:#ffffff;text-decoration:none;">确认邮箱</a></p>
        <p>建议在注册时使用的浏览器中打开链接。若在邮箱应用内打开后未自动登录，请返回网站，使用注册邮箱和密码登录。</p>
        <p style="font-size:14px;color:#58677b;">若按钮无法打开，可复制下面的链接到浏览器地址栏：</p>
        <p style="font-size:13px;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#203858;">{{ .ConfirmationURL }}</a></p>
        <p style="font-size:14px;color:#58677b;border-top:1px solid #d8dce2;padding-top:20px;">如果你没有申请注册，请忽略这封邮件。请勿将确认链接转发给他人。此邮件由系统自动发送，请勿直接回复。</p>
      </td></tr>
    </table>
  </body>
</html>
