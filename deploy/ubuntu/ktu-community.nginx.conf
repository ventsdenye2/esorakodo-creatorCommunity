# Replace community.example.org and certificate paths before enabling.
server {
    listen 80;
    server_name community.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name community.example.org;
    ssl_certificate /etc/letsencrypt/live/community.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
