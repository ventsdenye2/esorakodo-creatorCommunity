server {
    listen 80;
    listen [::]:80;
    server_name campus.kongtian.university;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ktu-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://campus.kongtian.university$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name campus.kongtian.university;
    ssl_certificate /etc/letsencrypt/live/campus.kongtian.university/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.kongtian.university/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Kongtian University Preview";
    auth_basic_user_file /etc/nginx/ktu-community.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 2m;
    access_log /var/log/nginx/ktu-community.access.log;
    error_log /var/log/nginx/ktu-community.error.log;
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
