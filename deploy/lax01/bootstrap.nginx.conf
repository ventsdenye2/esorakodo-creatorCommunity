# Only ACME verification is public; no app or Basic Auth over cleartext HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name campus.kongtian.university;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ktu-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
